name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-layers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Build runtime
        run: dotnet build src/runtime/SpatialAgent.Runtime.csproj --configuration Release --warnaserror
      - name: Build MCP adapter
        run: dotnet build src/adapters/Mcp/SpatialAgent.Adapters.Mcp.csproj --configuration Release --warnaserror
      - name: Audit portable dependencies
        run: dotnet list src/adapters/Mcp/SpatialAgent.Adapters.Mcp.csproj package --vulnerable --include-transitive
